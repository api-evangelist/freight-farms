aid: freight-farms
name: Freight Farms
description: >-
  Freight Farms is a Boston-based vertical farming company that builds the Greenery container
  farm, a commercial-scale, modular, hydroponic farm assembled inside a shipping container so
  growers can produce hyper-local produce 365 days a year in any climate. Its Farmhand software
  platform provides remote farm control, farm data analytics and insights, crop planning, and
  pre-set growing recipes, backed by certified training, onboarding, logistics, and technical
  support. The company reports 800+ farms across 50 U.S. states and 3 territories and 2,100+
  farmers in 42 countries. Freight Farms currently publishes no public developer API, portal, or
  OpenAPI surface; this API Evangelist profile captures its public web, brand, and legal
  properties plus a domain-security probe while a programmatic surface is monitored for.
